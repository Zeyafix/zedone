[workspace]
members = ["crates/core"]
exclude = ["prototypes"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
utoipa = "=6.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"
