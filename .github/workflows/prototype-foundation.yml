name: Prototype foundation

on:
  push:
    paths:
      - 'prototypes/**'
      - '.gitattributes'
      - 'scripts/environment-versions.json'
      - '.github/workflows/prototype-foundation.yml'
  pull_request:
    paths:
      - 'prototypes/**'
      - '.gitattributes'
      - 'scripts/environment-versions.json'
      - '.github/workflows/prototype-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and read Bun version
        id: versions
        run: |
          $versions = Get-Content -Raw scripts/environment-versions.json | ConvertFrom-Json
          rustup toolchain install $versions.rust --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          "bun=$($versions.bun)" >> $env:GITHUB_OUTPUT
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
          no-cache: true
      - name: Fetch locked Rust dependencies
        run: |
          $versions = Get-Content -Raw scripts/environment-versions.json | ConvertFrom-Json
          cargo "+$($versions.rust)" fetch --locked --manifest-path prototypes/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Dependency fetch failed.' }
      - name: Check prototype foundation and OpenAPI
        working-directory: prototypes
        run: bun run check
