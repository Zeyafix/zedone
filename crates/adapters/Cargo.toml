[package]
name = "zedone-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zedone-core = { path = "../core" }
zedone-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "time", "io-util", "io-std"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "=2.12.5", default-features = false, optional = true }

[features]
tauri = ["dep:tauri"]

[dev-dependencies]
tempfile.workspace = true
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
