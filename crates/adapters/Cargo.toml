[package]
name = "zedone-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
zedone-core = { path = "../core" }
zedone-storage = { path = "../storage" }
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "net", "time", "io-util", "io-std", "signal"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
sha2.workspace = true
zeroize = "=1.8.1"
getrandom.workspace = true
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio", "service"] }
http-body-util = "=0.1.5"

[target.'cfg(windows)'.dependencies]
keyring-core = "=1.0.1"
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "=2.12.5", default-features = false, optional = true }

[features]
tauri = ["dep:tauri"]

[dev-dependencies]
tempfile.workspace = true
tower = { version = "=0.5.3", features = ["util"] }

[lints]
workspace = true
