[package]
name = "zedone-prototype-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt", "net", "sync", "time"] }
serde = { version = "=1.0.229", features = ["derive"] }
utoipa = "=6.0.0"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
qrcodegen = "=1.8.0"

[dev-dependencies]
serde_json = "=1.0.154"
tempfile = "=3.27.0"
