name: Android environment and prototype

on:
  push:
    paths:
      - '.gitattributes'
      - '.github/workflows/android-environment.yml'
      - 'scripts/environment-versions.json'
      - 'scripts/check-android-environment.sh'
      - 'prototypes/**'
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/android-environment.yml'
      - 'scripts/environment-versions.json'
      - 'scripts/check-android-environment.sh'
      - 'prototypes/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned versions
        id: versions
        run: |
          echo "bun=$(jq -r .bun scripts/environment-versions.json)" >> "$GITHUB_OUTPUT"
          echo "jdk=$(jq -r .android.jdk scripts/environment-versions.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
          no-cache: true
      - name: Install pinned Android tools in an isolated SDK
        run: |
          versions="$GITHUB_WORKSPACE/scripts/environment-versions.json"
          sdk="$RUNNER_TEMP/zedone-android-sdk"
          tools="$sdk/cmdline-tools/$(jq -r .android.command_line_tools "$versions")"
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/$(jq -r .android.linux_archive "$versions")" -o "$RUNNER_TEMP/android-tools.zip"
          echo "$(jq -r .android.linux_sha256 "$versions")  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/zedone-android-tools"
          mkdir -p "$sdk/cmdline-tools"
          mv "$RUNNER_TEMP/zedone-android-tools/cmdline-tools" "$tools"
          printf 'y\n%.0s' {1..200} > "$RUNNER_TEMP/android-license-answers"
          while IFS= read -r package; do
            "$tools/bin/android" --no-metrics "--sdk=$sdk" sdk install "$package" < "$RUNNER_TEMP/android-license-answers"
          done < <(jq -r '.android.packages[]' "$versions")
          # CLI installation can silently pick the newest emulator even with @version.
          # Follow Google's archive-install procedure, retaining SDK license metadata.
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/$(jq -r .android.linux_emulator_archive "$versions")" -o "$RUNNER_TEMP/android-emulator.zip"
          echo "$(jq -r .android.linux_emulator_sha256 "$versions")  $RUNNER_TEMP/android-emulator.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-emulator.zip" -d "$RUNNER_TEMP/zedone-pinned-emulator"
          pinned_emulator="$RUNNER_TEMP/zedone-pinned-emulator/emulator"
          emulator_revision=$(jq -r '.android.packages[] | select(startswith("emulator@")) | split("@")[1]' "$versions")
          actual=$(sed -n 's/^Pkg.Revision *= *//p' "$pinned_emulator/source.properties" | tr -d '\r')
          test "$actual" = "$emulator_revision"
          python3 - "$sdk/emulator/package.xml" "$pinned_emulator/package.xml" "$emulator_revision" <<'PY'
          import sys
          from xml.dom import minidom

          document = minidom.parse(sys.argv[1])
          package = next(node for node in document.getElementsByTagName("localPackage")
                         if node.getAttribute("path") == "emulator")
          revision = package.getElementsByTagName("revision")[0]
          for name, value in zip(("major", "minor", "micro"), sys.argv[3].split("."), strict=True):
              revision.getElementsByTagName(name)[0].firstChild.nodeValue = value
          with open(sys.argv[2], "wb") as output:
              output.write(document.toxml(encoding="utf-8"))
          PY
          mv "$sdk/emulator" "$RUNNER_TEMP/zedone-unpinned-emulator"
          mv "$pinned_emulator" "$sdk/emulator"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "NDK_HOME=$sdk/ndk/$(jq -r .android.ndk "$versions")"
          } >> "$GITHUB_ENV"
          rustup toolchain install "$(jq -r .rust "$versions")" --profile minimal \
            --target aarch64-linux-android --target armv7-linux-androideabi \
            --target i686-linux-android --target x86_64-linux-android
      - name: Build Android prototype and host comparison endpoint
        working-directory: prototypes
        run: |
          versions="$GITHUB_WORKSPACE/scripts/environment-versions.json"
          rust=$(jq -r .rust "$versions")
          cargo "+$rust" install tauri-cli --version "$(jq -r .android.tauri_cli "$versions")" --locked
          cargo "+$rust" fetch --locked
          bun install --frozen-lockfile
          bun run check:types
          chmod +x src-tauri/gen/android/gradlew
          CARGO_TARGET_DIR="$PWD/target" cargo "+$rust" build --release --locked --offline --bin serve-echo
          bun run android:build
          bun run android:build aarch64
      - name: Prepare emulator runtime and KVM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600", OPTIONS+="static_node=kvm"\n' "$(id -u)" \
            | sudo tee /etc/udev/rules.d/99-zedone-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          test -r /dev/kvm && test -w /dev/kvm
      - name: Check Android environment
        run: |
          shellcheck scripts/check-android-environment.sh
          bash scripts/check-android-environment.sh bun prototypes/scripts/check-android.mjs
      - name: Check rejection and cleanup on compiler failure
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/android-failure.XXXXXXXX")
          trap 'status=$?; if (( status != 0 )); then cat "$test_dir/"*.log; fi; rm -rf -- "$test_dir"; exit "$status"' EXIT
          set -x
          mkdir -p "$test_dir/bin" "$test_dir/existing-avd"
          echo preserve > "$test_dir/existing-avd/sentinel"
          find temp -maxdepth 1 -name 'android-environment.*' | sort > "$test_dir/before"
          test ! -s "$test_dir/before"
          printf '#!/usr/bin/env bash\necho 0.0.0\n' > "$test_dir/bin/bun"
          chmod +x "$test_dir/bin/bun"
          status=0
          PATH="$test_dir/bin:$PATH" bash scripts/check-android-environment.sh > "$test_dir/version.log" 2>&1 || status=$?
          test "$status" -eq 1
          grep -q 'Unexpected Bun version' "$test_dir/version.log"
          rm "$test_dir/bin/bun"
          printf '#!/usr/bin/env bash\n[[ $* == *-vV* ]] || exit 23\n' > "$test_dir/bin/rustc"
          chmod +x "$test_dir/bin/rustc"
          status=0
          ANDROID_AVD_HOME="$test_dir/existing-avd" PATH="$test_dir/bin:$PATH" \
            bash scripts/check-android-environment.sh > "$test_dir/compiler.log" 2>&1 || status=$?
          test "$status" -eq 23
          find temp -maxdepth 1 -name 'android-environment.*' | sort > "$test_dir/after"
          cmp "$test_dir/before" "$test_dir/after"
          test "$(cat "$test_dir/existing-avd/sentinel")" = preserve
          echo 'Wrong version rejected; compiler exit 23 preserved; probe cleaned; existing AVD preserved.'
