name: Prototype foundation

on:
  push:
    branches: [main]
    paths:
      - 'prototypes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'api/**'
      - 'scripts/check-product.mjs'
      - '.gitattributes'
      - 'scripts/environment-versions.json'
      - '.github/workflows/prototype-foundation.yml'
  pull_request:
    paths:
      - 'prototypes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'api/**'
      - 'scripts/check-product.mjs'
      - '.gitattributes'
      - 'scripts/environment-versions.json'
      - '.github/workflows/prototype-foundation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    # Cold Windows setup plus debug/release builds can exhaust 10 minutes before UI checks.
    timeout-minutes: ${{ matrix.os == 'windows-2025' && 20 || 10 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and read JavaScript runtime versions
        id: versions
        run: |
          $versions = Get-Content -Raw scripts/environment-versions.json | ConvertFrom-Json
          rustup toolchain install $versions.rust --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed.' }
          "rust=$($versions.rust)" >> $env:GITHUB_OUTPUT
          "bun=$($versions.bun)" >> $env:GITHUB_OUTPUT
          "node=$($versions.node)" >> $env:GITHUB_OUTPUT
      - name: Restore Rust dependencies and build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.versions.outputs.rust }}
        with:
          prefix-key: zedone-rust-v1
          shared-key: prototype-host
          workspaces: |
            . -> target
            prototypes -> target
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
          no-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.versions.outputs.node }}
          package-manager-cache: false
      - name: Fetch locked Rust dependencies
        run: |
          $versions = Get-Content -Raw scripts/environment-versions.json | ConvertFrom-Json
          cargo "+$($versions.rust)" fetch --locked --manifest-path prototypes/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Dependency fetch failed.' }
          cargo "+$($versions.rust)" fetch --locked
          if ($LASTEXITCODE -ne 0) { throw 'Product dependency fetch failed.' }
      - name: Check product boundaries, contract and unsafe rejection
        run: bun scripts/check-product.mjs
      - name: Install locked JavaScript dependencies and test browser
        working-directory: prototypes
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript dependency installation failed.' }
          bun node_modules/playwright/cli.js install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { throw 'Test browser installation failed.' }
      - name: Check Rust, generated contracts, Vue and HTTP in Chromium
        working-directory: prototypes
        run: bun run check
