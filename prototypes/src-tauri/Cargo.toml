[package]
name = "zedone-prototype-android"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "zedone_prototype_android"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[target.'cfg(target_os = "android")'.dependencies]
tauri = { version = "=2.12.5", default-features = false, features = ["wry", "compression"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-barcode-scanner = "=2.5.3"
zedone-prototype-core = { path = "../core" }

[features]
custom-protocol = ["tauri/custom-protocol"]
