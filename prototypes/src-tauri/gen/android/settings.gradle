def sourceRoot = rootDir.toPath().resolve("../../../..").normalize().toFile()
def commentCheck = providers.exec {
    workingDir(sourceRoot)
    commandLine("bun", new File(sourceRoot, "scripts/source-comments.mjs").absolutePath)
    ignoreExitValue = true
}
def commentErrors = commentCheck.standardError.asText.get()
if (commentCheck.result.get().exitValue != 0) {
    throw new GradleException("Source comment policy failed:\n" + commentErrors)
}

include ':app'

apply from: 'tauri.settings.gradle'
