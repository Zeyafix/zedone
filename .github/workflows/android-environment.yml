name: Android environment and prototype

on:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/android-environment.yml'
      - 'scripts/environment-versions.json'
      - 'scripts/check-android-environment.sh'
      - 'scripts/install-ci-tauri.sh'
      - 'scripts/check-ci-tauri.sh'
      - 'prototypes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'api/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.contract.json'
      - 'tests/**'
      - 'client/**'
      - 'ui/**'
      - 'scripts/build-ui-android.mjs'
      - 'scripts/check-ui-android*.mjs'
      - 'scripts/check-product.mjs'
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/android-environment.yml'
      - 'scripts/environment-versions.json'
      - 'scripts/check-android-environment.sh'
      - 'scripts/install-ci-tauri.sh'
      - 'scripts/check-ci-tauri.sh'
      - 'prototypes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'api/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.contract.json'
      - 'tests/**'
      - 'client/**'
      - 'ui/**'
      - 'scripts/build-ui-android.mjs'
      - 'scripts/check-ui-android*.mjs'
      - 'scripts/check-product.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-checks:
    name: android (${{ matrix.suite }})
    strategy:
      fail-fast: false
      matrix:
        suite: [product-native, prototype-native, prototype-ui, shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read pinned versions
        id: versions
        run: |
          {
            echo "rust=$(jq -r .rust scripts/environment-versions.json)"
            echo "bun=$(jq -r .bun scripts/environment-versions.json)"
            echo "jdk=$(jq -r .android.jdk scripts/environment-versions.json)"
            echo "ndk=$(jq -r .android.ndk scripts/environment-versions.json)"
            echo "tauri=$(jq -r .android.tauri_cli scripts/environment-versions.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.jdk }}
          cache: ${{ (matrix.suite == 'prototype-ui' || matrix.suite == 'shell') && 'gradle' || '' }}
          cache-jdk: false
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-dependency-path: |
            scripts/environment-versions.json
            prototypes/Cargo.lock
            prototypes/src-tauri/gen/android/**/*.gradle*
            prototypes/src-tauri/gen/android/gradle.properties
            prototypes/src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.versions.outputs.bun }}
          no-cache: true
      - name: Report disk before Android setup
        run: df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - name: Check Tauri CLI cache fallback and cleanup
        run: |
          shellcheck scripts/install-ci-tauri.sh scripts/check-ci-tauri.sh
          bash scripts/check-ci-tauri.sh
      - name: Install pinned Android tools in an isolated SDK
        run: |
          versions="$GITHUB_WORKSPACE/scripts/environment-versions.json"
          sdk="$RUNNER_TEMP/zedone-android-sdk"
          tools="$sdk/cmdline-tools/$(jq -r .android.command_line_tools "$versions")"
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/$(jq -r .android.linux_archive "$versions")" -o "$RUNNER_TEMP/android-tools.zip"
          echo "$(jq -r .android.linux_sha256 "$versions")  $RUNNER_TEMP/android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/zedone-android-tools"
          mkdir -p "$sdk/cmdline-tools"
          mv "$RUNNER_TEMP/zedone-android-tools/cmdline-tools" "$tools"
          printf 'y\n%.0s' {1..200} > "$RUNNER_TEMP/android-license-answers"
          while IFS= read -r package; do
            "$tools/bin/android" --no-metrics "--sdk=$sdk" sdk install "$package" < "$RUNNER_TEMP/android-license-answers"
          done < <(jq -r '.android.packages[]' "$versions")
          # CLI installation can silently pick the newest emulator even with @version.
          # Follow Google's archive-install procedure, retaining SDK license metadata.
          curl --fail --location --retry 3 "https://dl.google.com/android/repository/$(jq -r .android.linux_emulator_archive "$versions")" -o "$RUNNER_TEMP/android-emulator.zip"
          echo "$(jq -r .android.linux_emulator_sha256 "$versions")  $RUNNER_TEMP/android-emulator.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-emulator.zip" -d "$RUNNER_TEMP/zedone-pinned-emulator"
          pinned_emulator="$RUNNER_TEMP/zedone-pinned-emulator/emulator"
          emulator_revision=$(jq -r '.android.packages[] | select(startswith("emulator@")) | split("@")[1]' "$versions")
          actual=$(sed -n 's/^Pkg.Revision *= *//p' "$pinned_emulator/source.properties" | tr -d '\r')
          test "$actual" = "$emulator_revision"
          python3 - "$sdk/emulator/package.xml" "$pinned_emulator/package.xml" "$emulator_revision" <<'PY'
          import sys
          from xml.dom import minidom

          document = minidom.parse(sys.argv[1])
          package = next(node for node in document.getElementsByTagName("localPackage")
                         if node.getAttribute("path") == "emulator")
          revision = package.getElementsByTagName("revision")[0]
          for name, value in zip(("major", "minor", "micro"), sys.argv[3].split("."), strict=True):
              revision.getElementsByTagName(name)[0].firstChild.nodeValue = value
          with open(sys.argv[2], "wb") as output:
              output.write(document.toxml(encoding="utf-8"))
          PY
          mv "$sdk/emulator" "$RUNNER_TEMP/zedone-unpinned-emulator"
          mv "$pinned_emulator" "$sdk/emulator"
          # These downloads/unpacked copies belong to this one-off setup only.
          rm -- "$RUNNER_TEMP/android-tools.zip" "$RUNNER_TEMP/android-emulator.zip"
          rm -r -- "$RUNNER_TEMP/zedone-unpinned-emulator"
          {
            echo "ANDROID_HOME=$sdk"
            echo "ANDROID_SDK_ROOT=$sdk"
            echo "NDK_HOME=$sdk/ndk/$(jq -r .android.ndk "$versions")"
          } >> "$GITHUB_ENV"
          rustup toolchain install "$(jq -r .rust "$versions")" --profile minimal \
            --target aarch64-linux-android --target armv7-linux-androideabi \
            --target i686-linux-android --target x86_64-linux-android
      - name: Restore Rust dependencies and Android build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.versions.outputs.rust }}
        with:
          prefix-key: zedone-rust-v1
          shared-key: prototype-android-ndk-${{ steps.versions.outputs.ndk }}
          workspaces: |
            . -> target
            prototypes -> target
          cache-bin: false
          # One writer retains the existing cache namespace and restore paths;
          # parallel suites must not race to publish different subsets.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.suite == 'product-native' }}
      - name: Restore pinned Tauri CLI
        id: tauri-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/zedone-tauri-cli/bin/cargo-tauri
          key: zedone-tauri-v1-${{ runner.os }}-${{ runner.arch }}-rust-${{ steps.versions.outputs.rust }}-cli-${{ steps.versions.outputs.tauri }}
      - name: Install or verify pinned Tauri CLI
        run: |
          shellcheck scripts/install-ci-tauri.sh
          df -h "$RUNNER_TEMP"
          bash scripts/install-ci-tauri.sh
          echo "$RUNNER_TEMP/zedone-tauri-cli/bin" >> "$GITHUB_PATH"
      - name: Prepare locked product JavaScript dependencies
        if: matrix.suite == 'product-native' || matrix.suite == 'shell'
        run: |
          bun install --frozen-lockfile --ignore-scripts
          rust=$(jq -r .rust scripts/environment-versions.json)
          if [[ '${{ matrix.suite }}' == shell ]]; then
            cargo "+$rust" fetch --locked --manifest-path ui/src-tauri/Cargo.toml
          else
            cargo "+$rust" fetch --locked
          fi
      - name: Prepare locked prototype dependencies and contracts
        if: matrix.suite == 'prototype-native' || matrix.suite == 'prototype-ui'
        working-directory: prototypes
        run: |
          versions="$GITHUB_WORKSPACE/scripts/environment-versions.json"
          rust=$(jq -r .rust "$versions")
          cargo "+$rust" fetch --locked
          bun install --frozen-lockfile
          if [[ '${{ matrix.suite }}' == prototype-native ]]; then bun run check:types; fi
          chmod +x src-tauri/gen/android/gradlew
      - name: Build host comparison endpoint
        if: matrix.suite == 'prototype-ui'
        working-directory: prototypes
        run: |
          rust=$(jq -r .rust "$GITHUB_WORKSPACE/scripts/environment-versions.json")
          CARGO_TARGET_DIR="$PWD/target" cargo "+$rust" build --release --locked --offline --bin serve-echo
      - name: Build Android x86_64 APK and instrumentation
        if: matrix.suite == 'prototype-ui'
        working-directory: prototypes
        run: bun run android:build
      - name: Build Android arm64 APK and instrumentation
        if: matrix.suite == 'prototype-ui'
        working-directory: prototypes
        run: bun run android:build aarch64
      - name: Build product UI shell for both Android ABIs
        if: matrix.suite == 'shell'
        run: |
          chmod +x ui/src-tauri/gen/android/gradlew
          bun scripts/build-ui-android.mjs x86_64
          bun scripts/build-ui-android.mjs aarch64
          rust=$(jq -r .rust scripts/environment-versions.json)
          CARGO_TARGET_DIR="$PWD/target" cargo "+$rust" build --manifest-path ui/src-tauri/Cargo.toml --example shell-fixture --locked --offline
      - name: Check host Automerge probe
        if: matrix.suite == 'prototype-native'
        working-directory: prototypes
        run: bun run check:automerge
      - name: Prepare emulator runtime and KVM
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libpulse0
          printf 'KERNEL=="kvm", OWNER="%s", MODE="0600", OPTIONS+="static_node=kvm"\n' "$(id -u)" \
            | sudo tee /etc/udev/rules.d/99-zedone-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=10
          test -r /dev/kvm && test -w /dev/kvm
      - name: Check Android environment
        run: |
          shellcheck scripts/check-android-environment.sh
          bash scripts/check-android-environment.sh bun prototypes/scripts/check-android-ci.mjs '${{ matrix.suite }}'
      - name: Check rejection and cleanup on compiler failure
        run: |
          test_dir=$(mktemp -d "$RUNNER_TEMP/android-failure.XXXXXXXX")
          trap 'status=$?; if (( status != 0 )); then cat "$test_dir/"*.log; fi; rm -rf -- "$test_dir"; exit "$status"' EXIT
          set -x
          mkdir -p "$test_dir/bin" "$test_dir/existing-avd"
          echo preserve > "$test_dir/existing-avd/sentinel"
          find temp -maxdepth 1 -name 'android-environment.*' | sort > "$test_dir/before"
          test ! -s "$test_dir/before"
          printf '#!/usr/bin/env bash\necho 0.0.0\n' > "$test_dir/bin/bun"
          chmod +x "$test_dir/bin/bun"
          status=0
          PATH="$test_dir/bin:$PATH" bash scripts/check-android-environment.sh > "$test_dir/version.log" 2>&1 || status=$?
          test "$status" -eq 1
          grep -q 'Unexpected Bun version' "$test_dir/version.log"
          rm "$test_dir/bin/bun"
          printf '#!/usr/bin/env bash\n[[ $* == *-vV* ]] || exit 23\n' > "$test_dir/bin/rustc"
          chmod +x "$test_dir/bin/rustc"
          status=0
          ANDROID_AVD_HOME="$test_dir/existing-avd" PATH="$test_dir/bin:$PATH" \
            bash scripts/check-android-environment.sh > "$test_dir/compiler.log" 2>&1 || status=$?
          test "$status" -eq 23
          find temp -maxdepth 1 -name 'android-environment.*' | sort > "$test_dir/after"
          cmp "$test_dir/before" "$test_dir/after"
          test "$(cat "$test_dir/existing-avd/sentinel")" = preserve
          echo 'Wrong version rejected; compiler exit 23 preserved; probe cleaned; existing AVD preserved.'
      - name: Report Android disk usage
        if: always()
        run: |
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for directory in "$ANDROID_HOME" "$HOME/.cargo" "$HOME/.gradle" \
            "$GITHUB_WORKSPACE/prototypes/target" "$GITHUB_WORKSPACE/temp" \
            "$RUNNER_TEMP/zedone-tauri-cli"; do
            if [[ -d $directory ]]; then du -sh -- "$directory"; fi
          done
      - name: Save pinned Tauri CLI from successful main checks
        if: success() && github.ref == 'refs/heads/main' && steps.tauri-cache.outputs.cache-hit != 'true' && steps.tauri-cache.outputs.cache-primary-key != ''
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/zedone-tauri-cli/bin/cargo-tauri
          key: ${{ steps.tauri-cache.outputs.cache-primary-key }}

  # Keep one stable required check. An omitted, cancelled or failed suite fails
  # the aggregate; a green subset can never approve this PR.
  android:
    needs: android-checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every Android suite
        env:
          RESULT: ${{ needs.android-checks.result }}
        run: test "$RESULT" = success
