[workspace]
members = ["crates/core", "crates/storage", "crates/adapters"]
exclude = ["prototypes"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "CC-BY-NC-SA-4.0"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
utoipa = "=6.0.0"
automerge = "=0.12.0"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
tokio = { version = "=1.54.1", features = ["sync"] }
tempfile = "=3.27.0"
sha2 = "=0.11.1"
getrandom = "=0.4.3"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }

[workspace.lints.rust]
unsafe_code = "forbid"
