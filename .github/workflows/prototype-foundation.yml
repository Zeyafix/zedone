name: Prototype foundation

on:
  push:
    branches: [main]
    paths:
      - 'prototypes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'api/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.contract.json'
      - 'tests/**'
      - 'client/**'
      - 'ui/**'
      - 'scripts/check-ui*.mjs'
      - 'scripts/check-product.mjs'
      - '.gitattributes'
      - 'scripts/environment-versions.json'
      - '.github/workflows/prototype-foundation.yml'
      - '.github/actions/prepare-host-check/**'
  pull_request:
    paths:
      - 'prototypes/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'api/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.contract.json'
      - 'tests/**'
      - 'client/**'
      - 'ui/**'
      - 'scripts/check-ui*.mjs'
      - 'scripts/check-product.mjs'
      - '.gitattributes'
      - 'scripts/environment-versions.json'
      - '.github/workflows/prototype-foundation.yml'
      - '.github/actions/prepare-host-check/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototype-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linux-checks:
    strategy:
      fail-fast: false
      matrix:
        suite: [product, prototype-native, prototype-ui, shell]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-host-check
        with:
          suite: ${{ matrix.suite }}
      - name: Check product boundaries, contract and unsafe rejection
        if: matrix.suite == 'product'
        run: bun scripts/check-product.mjs
      - name: Check prototype Rust, restart probe and generated contracts
        if: matrix.suite == 'prototype-native'
        working-directory: prototypes
        run: bun run check --host-native
      - name: Check prototype release, Vue and HTTP in Chromium
        if: matrix.suite == 'prototype-ui'
        working-directory: prototypes
        run: bun run check --host-ui
      - name: Check shared UI shell and real product HTTP in Chromium
        if: matrix.suite == 'shell'
        run: bun run ui:check

  # Preserve the required Linux check; a green subset cannot pass it.
  linux:
    name: check (ubuntu-24.04)
    needs: linux-checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every Linux suite
        env:
          RESULT: ${{ needs.linux-checks.result }}
        run: test "$RESULT" = success

  windows-checks:
    strategy:
      fail-fast: false
      matrix:
        suite: [product, prototype-native, prototype-ui, shell]
    runs-on: windows-2025
    # Keep the previous cold-build budget until the split has been measured.
    # The warm workflow target is 10 minutes, not the sum of these job budgets.
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare-host-check
        with:
          suite: ${{ matrix.suite }}
      - name: Check product boundaries, contract and unsafe rejection
        if: matrix.suite == 'product'
        run: bun scripts/check-product.mjs
      - name: Check prototype Rust, restart probe and generated contracts
        if: matrix.suite == 'prototype-native'
        working-directory: prototypes
        run: bun run check --host-native
      - name: Check prototype release, Vue and HTTP in Chromium
        if: matrix.suite == 'prototype-ui'
        working-directory: prototypes
        run: bun run check --host-ui
      - name: Check shared UI shell and real product HTTP in Chromium
        if: matrix.suite == 'shell'
        run: bun run ui:check

  # Preserve the required check name. Only a complete successful matrix passes.
  windows:
    name: check (windows-2025)
    needs: windows-checks
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every Windows suite
        env:
          RESULT: ${{ needs.windows-checks.result }}
        run: test "$RESULT" = success
