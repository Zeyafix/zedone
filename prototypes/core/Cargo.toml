[package]
name = "zedone-prototype-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
tokio = { version = "=1.54.1", features = ["macros", "rt", "net", "sync", "time", "io-util", "io-std"] }
serde = { version = "=1.0.229", features = ["derive"] }
utoipa = "=6.0.0"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
qrcodegen = "=1.8.0"
serde_json = "=1.0.154"
getrandom = "=0.4.3"

[dev-dependencies]
tempfile = "=3.27.0"
